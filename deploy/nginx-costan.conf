# System nginx drop-in for the costan backend origin. Replace api.example.com
# with your API hostname throughout. Install to:
#   /etc/nginx/conf.d/costan.conf
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Matches by server_name (no default_server), so it coexists with a distro's stock
# default server (RHEL/Alma ship one in nginx.conf), so nothing needs removing.
# Included inside the stock nginx.conf http{} block. The backend is a local systemd
# service on a fixed port, so the upstream is just 127.0.0.1:4757 (no resolver or
# variable proxy_pass needed).

# WebSocket upgrade plumbing (http context).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Real client IP. Only Cloudflare connects to this origin (Authenticated Origin
# Pulls below, plus a firewall that admits only Cloudflare's ranges; see
# DEPLOY.md), so the address nginx sees is a Cloudflare edge. Trust
# CF-Connecting-IP from those ranges only, which rewrites $remote_addr to the
# real client. A request from any other address keeps its own $remote_addr and
# its CF-Connecting-IP header is ignored.
#
# Cloudflare publishes the list at https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6. It changes rarely; re-check it now and then.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Safety-net HTTP->HTTPS redirect; Cloudflare reaches the origin over TLS.
server {
  listen 80;
  listen [::]:80;
  server_name api.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.example.com;   # backend origin host (NOT the Pages site).
  # No default_server: we match by name, so this coexists with a distro's stock
  # default server (e.g. RHEL/Alma's nginx.conf). Cloudflare always sends this Host.

  # Cloudflare Origin CA cert/key, SOPS-decrypted into tmpfs by costan-certs.service
  # (ordered Before nginx) so the private key is never plaintext on disk. Zone SSL
  # mode: Full (Strict).
  ssl_certificate     /run/costan-certs/origin.pem;
  ssl_certificate_key /run/costan-certs/origin.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Authenticated Origin Pulls: Cloudflare presents a client certificate on
  # every connection to the origin, and anything without one is refused at the
  # TLS handshake. Turn it on in the Cloudflare dashboard (SSL/TLS > Origin
  # Server > Authenticated Origin Pulls) and install Cloudflare's origin-pull CA
  # at the path below; it is public, so download it from Cloudflare's docs page
  # "Authenticated Origin Pulls" (the zone-level certificate,
  # authenticated_origin_pull_ca.pem). See DEPLOY.md.
  ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
  ssl_verify_client on;

  # API + websocket only. Cloudflare serves the static frontend from Pages and must
  # route only these prefixes here, under the same hostname as the site.
  location ~ ^/(api|auth|ws|discord)(/|$) {
    proxy_pass http://127.0.0.1:4757;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    # The backend reads the client IP from CF-Connecting-IP
    # (COSTAN_REAL_IP_HEADER). Overwrite it with the address real_ip resolved
    # above rather than forwarding whatever the request carried, so a client
    # cannot forge it: from a Cloudflare edge this is the real client, from
    # anywhere else it is the connecting address itself.
    proxy_set_header CF-Connecting-IP  $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-lived game streams (server pings every 50s); keep a wide margin.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering    off;
  }

  location = /healthz {
    proxy_pass http://127.0.0.1:4757;
    access_log off;
  }

  # Everything else belongs to Pages, not this origin.
  location / { return 404; }
}
