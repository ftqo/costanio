# Template for the encrypted secrets. Copy to the repo root (gitignored), fill in,
# encrypt, then install on the server as /etc/costan/secrets.enc.yaml:
#
#   cp deploy/secrets.example.yaml secrets.enc.yaml
#   sops -e -i secrets.enc.yaml        # encrypt in place (uses .sops.yaml recipient)
#   sops secrets.enc.yaml              # opens decrypted in $EDITOR; fill values, save
#
#   scp secrets.enc.yaml <admin user>@<server>:/tmp/
#   # on the server:
#   sudo install -m 600 -o root -g root /tmp/secrets.enc.yaml /etc/costan/secrets.enc.yaml
#
# Never commit it, encrypted or not. Leave a key empty ("") to disable
# the feature it powers (e.g. no bot token => supporter sync off).
#
# Keys must match the names in deploy/secrets-decrypt.sh and the *_FILE env vars in
# deploy/costan.service.
discord_client_secret: ""
google_client_secret: ""
discord_bot_token: ""
